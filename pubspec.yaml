name: campusfix
description: "Safe Campus - A Campus Incident Reporting App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  
  # Image & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  cloudinary_public: ^0.21.0
  image: ^4.2.0
  
  # Navigation
  go_router: ^14.6.2
  
  # UI & Utils
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  shimmer: ^3.0.0
  timeago: ^3.7.0
  flutter_dotenv: ^5.2.1
  
  # Charts
  fl_chart: ^0.70.1
  
  # Additional
  dio: ^5.7.0
  http_parser: ^4.1.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
